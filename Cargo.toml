[package]
name = "koburi"
version = "0.3.13"
edition = "2024"
description = "Tiny HTTP bridge for container stats (Docker/Podman/PM2)"
license = "MIT"
repository = "https://github.com/sinkaroid/koburi"
keywords = ["docker", "podman", "pm2", "stats", "api"]
authors = ["sinkaroid"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true